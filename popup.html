<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        font-family: system-ui, sans-serif;
        margin: 0; padding: 16px;
        background: #1a1a1a; color: #f5f5f5;
      }
      h1 { font-size: 14px; margin: 0 0 12px; font-weight: 600; }
      label { font-size: 11px; color: #9aa0a6; display: block; margin: 10px 0 4px; }
      input {
        width: 100%; box-sizing: border-box; padding: 8px;
        border: 1px solid #3c4043; border-radius: 6px;
        background: #2a2a2a; color: #f5f5f5; font-size: 13px;
      }
      button {
        width: 100%; padding: 10px; margin-top: 10px;
        font-size: 14px; font-weight: 600; border: none; border-radius: 8px;
        cursor: pointer; color: #fff;
      }
      #stream { background: #1a73e8; }
      #record { background: #5f6368; }
      #stop { background: #d93025; }
      button:disabled { opacity: .5; cursor: default; }
      .hidden { display: none; }
      #status { margin-top: 12px; font-size: 12px; color: #9aa0a6; min-height: 16px; }
      #status.err { color: #ff7b72; }
      #status.warn { color: #f9ab00; }
      .dot {
        display: inline-block; width: 8px; height: 8px; border-radius: 50%;
        background: #d93025; margin-right: 6px; animation: pulse 1s infinite;
      }
      .dot.warn { background: #f9ab00; }
      .dot.err { background: #d93025; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
      .note { margin-top: 12px; font-size: 11px; color: #6b6f73; line-height: 1.4; }
    </style>
  </head>
  <body>
    <h1>Tab Audio Recorder</h1>

    <div id="controls">
      <label for="server">Server address (for live streaming)</label>
      <input id="server" type="text" placeholder="192.168.1.5:8080" />
      <button id="stream">Stream live to server</button>
      <button id="record">Record to file</button>
    </div>

    <button id="stop" class="hidden">Stop</button>

    <div id="status"></div>
    <div class="note">
      Streams/records audio from the current tab. For streaming, both devices
      must reach each other (same LAN or VPN). Only record meetings with consent.
    </div>
    <script src="popup.js"></script>
  </body>
</html>
